[project]
name = "kpi-detective"
version = "1.0.0"
description = "An agentic AI system for root cause analysis of business metric drops, with a ground-truth benchmark."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Deepak" }]
license = { text = "MIT" }
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "duckdb>=1.0",
    "langgraph>=0.2",
    "matplotlib>=3.8",
    "tabulate>=0.9",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40", "openai>=1.40"]
app = ["streamlit>=1.36", "plotly>=5.20"]
dev = ["pytest>=8", "ruff>=0.5", "nbformat>=5.9", "nbconvert>=7.16", "ipykernel>=6.29"]

[project.scripts]
kpi-detective = "kpi_detective.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kpi_detective"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008"]
